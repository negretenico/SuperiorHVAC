name: Smoke (production)

# Checks the live site answers. Runs:
#  - daily on a schedule,
#  - by hand (Actions tab > Smoke (production) > Run workflow), e.g. right after a deploy,
#  - from another workflow via `workflow_call` (e.g. a future deploy workflow: `uses: ./.github/workflows/smoke.yml`).
# Workers Builds deploys on the Cloudflare side and does not trigger GitHub Actions; see README "After each deploy".
# Base URL: the `url` input, else the repository variable PROD_URL (e.g. https://example.com).

on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to test (defaults to the PROD_URL repository variable)
        required: false
        type: string
  workflow_call:
    inputs:
      url:
        description: Base URL to test (defaults to the PROD_URL repository variable)
        required: false
        type: string
  schedule:
    - cron: "17 11 * * *" # daily, ~6-7am Ohio time

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ inputs.url || vars.PROD_URL }}
      # Text that must appear on the homepage. Override with the SMOKE_EXPECT_TEXT repository variable.
      EXPECT_TEXT: ${{ vars.SMOKE_EXPECT_TEXT || 'Superior HVAC' }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$BASE_URL" ]; then
            if [ "$EVENT" = "schedule" ]; then
              echo "::notice::PROD_URL repository variable is not set yet; skipping scheduled smoke test."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Set the PROD_URL repository variable (Settings > Secrets and variables > Actions > Variables) or pass the url input."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Testing ${BASE_URL%/}"

      - name: GET /api/health returns 200 {"ok":true}
        if: steps.config.outputs.skip != 'true'
        run: |
          url="${BASE_URL%/}/api/health"
          code=$(curl -sS -o body.txt -w '%{http_code}' --retry 4 --retry-delay 15 --retry-all-errors --max-time 20 \
            -H 'cache-control: no-cache' "$url")
          echo "HTTP $code: $(head -c 300 body.txt)"
          [ "$code" = "200" ] || { echo "::error::$url returned HTTP $code"; exit 1; }
          grep -q '"ok":true' body.txt || { echo "::error::$url body does not contain \"ok\":true"; exit 1; }

      - name: GET / returns 200 with expected text
        if: steps.config.outputs.skip != 'true'
        run: |
          url="${BASE_URL%/}/"
          code=$(curl -sS -L -o page.html -w '%{http_code}' --retry 4 --retry-delay 15 --retry-all-errors --max-time 20 "$url")
          echo "HTTP $code, $(wc -c < page.html) bytes"
          [ "$code" = "200" ] || { echo "::error::$url returned HTTP $code"; exit 1; }
          grep -qF "$EXPECT_TEXT" page.html || { echo "::error::$url does not contain \"$EXPECT_TEXT\""; exit 1; }
          grep -q 'application/ld+json' page.html || { echo "::error::$url has no JSON-LD"; exit 1; }
