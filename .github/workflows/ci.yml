name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR/branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  # Cloudflare's public always-pass Turnstile TEST site key. The real key is set in Workers Builds.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

jobs:
  verify:
    name: Typecheck, lint, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Upload static export for e2e + Lighthouse
        uses: actions/upload-artifact@v7
        with:
          name: site-out
          path: out/
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: Playwright (all projects)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site-out
          path: out/
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      # e2e/prepare.mts (run by the webServer command) applies local D1 migrations and
      # reuses ./out, then wrangler dev serves it with .dev.vars.e2e (test keys, NOTIFIER=log).
      - name: Run Playwright
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: test-results/screenshots/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (mobile)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site-out
          path: out/
      # Uses the Chrome preinstalled on ubuntu-latest. Config: lighthouserc.json.
      - name: Run Lighthouse CI
        run: npm run lighthouse
      - name: Upload Lighthouse results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
