# Cloudflare Worker: serves the Next.js static export (./out) and handles /api/*.
name = "superior-hvac"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# Custom domain: Cloudflare creates the DNS record and certificate on deploy.
routes = [{ pattern = "superiorhvacoh.com", custom_domain = true }]

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "superior-hvac"
database_id = "7afbfe83-845b-493d-841a-26856d3954e1"
migrations_dir = "db/migrations"

# Native Workers rate limiter. Periods are 10 or 60 seconds only.
[[ratelimits]]
name = "BOOKING_RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 3
  period = 60

# Retry failed notifications + purge old bookings.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[vars]
NOTIFIER = "resend"

# ---------------------------------------------------------------------------
# e2e: local test runs only (`wrangler dev --env e2e`, started by Playwright).
# Same bindings as production, but a high rate limit so the test suite's real
# submits across devices don't trip the 3/min production limit. Never deployed.
[env.e2e]
name = "superior-hvac-e2e"

[env.e2e.assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

[[env.e2e.d1_databases]]
binding = "DB"
database_name = "superior-hvac"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "db/migrations"

[[env.e2e.ratelimits]]
name = "BOOKING_RATE_LIMITER"
namespace_id = "1002"
  [env.e2e.ratelimits.simple]
  limit = 1000
  period = 60

[env.e2e.vars]
NOTIFIER = "log"
